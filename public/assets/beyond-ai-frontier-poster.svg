<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1620"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eef7d2"/></linearGradient><radialGradient id="globe"><stop stop-color="#5ec8ff"/><stop offset=".55" stop-color="#123c64"/><stop offset="1" stop-color="#07151f"/></radialGradient></defs><rect width="1080" height="1620" fill="url(#bg)"/><text x="60" y="80" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#111b25">G<tspan fill="#b9e600">-</tspan>NeMa</text><text x="60" y="112" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" fill="#44504b">GALACTIC NEXUS OF MACHINES</text><text x="540" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="86" font-weight="900" fill="#101a23">BEYOND <tspan fill="#78a900">AI</tspan></text><text x="540" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" letter-spacing="8" fill="#34413b">THE NEXT INTELLIGENCE FRONTIER</text><circle cx="540" cy="760" r="205" fill="url(#globe)" stroke="#b9e600" stroke-width="7"/><text x="540" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="white">A MORE</text><text x="540" y="772" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="white">INTELLIGENT</text><text x="540" y="809" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="white">HUMAN-CENTRIC</text><text x="540" y="846" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="white">FUTURE</text><g font-family="Arial,sans-serif"><g><rect x="35" y="320" width="300" height="175" rx="24" fill="#dff7f5"/><text x="55" y="360" font-size="20" font-weight="800" fill="#126b73">AGENCY ECONOMY</text><text x="55" y="395" font-size="15" fill="#33413d">AI agents collaborate,</text><text x="55" y="418" font-size="15" fill="#33413d">coordinate and execute.</text></g><g><rect x="390" y="300" width="300" height="190" rx="24" fill="#dceaff"/><text x="410" y="340" font-size="20" font-weight="800" fill="#1758a8">AUTONOMOUS</text><text x="410" y="365" font-size="20" font-weight="800" fill="#1758a8">INTELLIGENCE</text><text x="410" y="405" font-size="15" fill="#33413d">Goal → Plan → Act → Adapt</text></g><g><rect x="745" y="320" width="300" height="175" rx="24" fill="#eee5ff"/><text x="765" y="360" font-size="20" font-weight="800" fill="#6241b0">BRAIN-COMPUTER</text><text x="765" y="385" font-size="20" font-weight="800" fill="#6241b0">INTERFACES</text><text x="765" y="420" font-size="15" fill="#33413d">Neural links between</text><text x="765" y="443" font-size="15" fill="#33413d">human thought and machines.</text></g><g><rect x="35" y="525" width="300" height="175" rx="24" fill="#ffe9f4"/><text x="55" y="565" font-size="20" font-weight="800" fill="#a32c71">QUANTUM COMPUTING</text><text x="55" y="600" font-size="15" fill="#33413d">New computational paradigms</text><text x="55" y="623" font-size="15" fill="#33413d">for selected hard problems.</text></g><g><rect x="745" y="525" width="300" height="175" rx="24" fill="#ffe4ef"/><text x="765" y="565" font-size="20" font-weight="800" fill="#ad2872">COGNITIVE AUGMENTATION</text><text x="765" y="600" font-size="15" fill="#33413d">Extending perception, memory</text><text x="765" y="623" font-size="15" fill="#33413d">and complex knowledge work.</text></g><g><rect x="35" y="900" width="300" height="175" rx="24" fill="#eee5ff"/><text x="55" y="940" font-size="20" font-weight="800" fill="#6041a8">NEUROMORPHIC</text><text x="55" y="965" font-size="20" font-weight="800" fill="#6041a8">COMPUTING</text><text x="55" y="1000" font-size="15" fill="#33413d">Brain-inspired, event-driven</text><text x="55" y="1023" font-size="15" fill="#33413d">efficient intelligence.</text></g><g><rect x="745" y="900" width="300" height="175" rx="24" fill="#e1f8e8"/><text x="765" y="940" font-size="20" font-weight="800" fill="#18784b">SYNTHETIC BIOLOGY</text><text x="765" y="975" font-size="15" fill="#33413d">Engineering biological systems</text><text x="765" y="998" font-size="15" fill="#33413d">with computation and AI.</text></g><g><rect x="35" y="1110" width="300" height="175" rx="24" fill="#e5f3ff"/><text x="55" y="1150" font-size="20" font-weight="800" fill="#1760a7">DNA DATA STORAGE</text><text x="55" y="1185" font-size="15" fill="#33413d">Information encoded in DNA</text><text x="55" y="1208" font-size="15" fill="#33413d">for dense archival storage.</text></g><g><rect x="745" y="1110" width="300" height="175" rx="24" fill="#fff0dc"/><text x="765" y="1150" font-size="20" font-weight="800" fill="#a55b12">BIOCONVERGENCE</text><text x="765" y="1185" font-size="15" fill="#33413d">AI + biology + materials</text><text x="765" y="1208" font-size="15" fill="#33413d">+ nanotechnology + robotics.</text></g></g><text x="540" y="1395" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17211e">FROM INTELLIGENCE TO POSSIBILITY</text><text x="540" y="1432" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" letter-spacing="5" fill="#56625d">PEOPLE · TECHNOLOGY · PLANET · FRONTIER RESEARCH</text><rect y="1490" width="1080" height="130" fill="#0e1716"/><text x="540" y="1545" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#b9e600">G-NeMa</text><text x="540" y="1578" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" letter-spacing="4" fill="#d9dfdc">GALACTIC NEXUS OF MACHINES · BEYOND AI</text></svg>