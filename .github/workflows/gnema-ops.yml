name: G-NeMa Ops Bot

on:
  workflow_dispatch:

  schedule:
    # Daily technical SEO audit at 06:30 UTC.
    - cron: "30 6 * * *"
    # Weekly Search Console report on Monday at 07:00 UTC.
    - cron: "0 7 * * 1"

  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  seo-ops:
    name: SEO Audit and Ranking Operations
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run G-NeMa Ops Bot
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python ops/bot.py

      - name: Run Search Console authority tracker
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          python ops/search_console.py

      - name: Upload SEO reports
        uses: actions/upload-artifact@v4
        with:
          name: gnema-seo-reports
          path: ops/reports/

      - name: Commit latest Ops reports
        run: |
          git config user.name "G-NeMa Ops Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Main report is always expected.
          git add ops/reports/latest.md

          # Search Console report is optional until credentials are configured.
          if [ -f ops/reports/search-console.md ]; then
            git add ops/reports/search-console.md
          fi

          if git diff --cached --quiet; then
            echo "No report change to commit."
          else
            git commit -m "chore(seo): update G-NeMa Ops reports"
            git push origin main
          fi
