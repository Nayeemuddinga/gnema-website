name: G-NeMa Ops Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
    - cron: "0 7 * * 1"

# Read-only by default. Reports are artifacts; production code is never pushed by this job.
permissions:
  contents: read

jobs:
  seo-ops:
    name: SEO Audit and Ranking Operations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run G-NeMa Ops Bot
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python ops/bot.py

      - name: Run Search Console authority tracker
        if: ${{ env.GSC_CLIENT_ID != '' && env.GSC_CLIENT_SECRET != '' && env.GSC_REFRESH_TOKEN != '' }}
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python ops/search_console.py

      - name: Upload SEO reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnema-seo-reports
          path: ops/reports/
          if-no-files-found: warn
          retention-days: 14
