name: G-NeMa Production Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate repository structure
        run: |
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f _headers
          test -f 404.html
          test -d assets
          test -d architecture

      - name: Validate HTML metadata and links
        run: python ops/quality_gates.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Detect accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='sitemap.xml' \
            '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|ghp_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{20,})' .; then
            echo 'Potential credential material detected.'
            exit 1
          fi

  seo-ops:
    name: SEO Operations
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run SEO audit
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python ops/bot.py
      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnema-quality-seo-report
          path: ops/reports/
          if-no-files-found: warn
          retention-days: 14
